# =======================================================
# 轴心双子·全量化筛选系统 v1.1 · 配置文件
# =======================================================

# 数据源
data_sources:
  binance_fapi: "https://fapi.binance.com"
  aicoin_public: "https://api.aicoin.net"
  aicoin_uid: "5374665"

# 基础过滤
filter:
  min_volume_24h: 2000000
  max_abs_change_24h: 30
  stablecoins: ["USDCUSDT", "FDUSDUSDT", "TUSDUSDT", "USDPUSDT", "DAIUSDT", "USTCUSDT"]

# 均线周期
ema:
  ema12: 12
  ema26: 26
  ema50: 50
  ema144: 144

# 缠论参数
chanlun:
  min_bars_per_bi: 3
  central_overlap_bis: 3
  retrace_bars: 3

# 指标权重（总和100）
weights:
  structure: 30
  macd: 20
  volume_obv: 18
  ma_resonance: 12
  rsi: 8
  kdj: 8
  cci: 4

# 量能阈值
volume:
  breakout_long_mult: 1.5
  breakout_short_mult: 1.3
  turnover_mult: 2.0
  avg_volume_period: 20

# RSI 阈值
rsi:
  period: 14
  strong_min: 55
  strong_max: 75
  weak_threshold: 45

# CCI 阈值
cci:
  period: 14
  strong_threshold: 100
  sustain_bars: 3

# KDJ 参数
kdj:
  n: 9
  oversold: 20
  overbought: 80

# 乖离率预警
bias:
  period: 26
  overheat: 8
  oversold: -8

# ADX 趋势过滤器
adx:
  period: 14
  trend_threshold: 25
  range_threshold: 20

# 布林带催化剂
bollinger:
  period: 20
  std_mult: 2
  bandwidth_threshold: 5

# 周线位置
weekly:
  high_risk_distance: 15
  deep_bear_distance: 30

# 推送分级
rating:
  s_threshold: 85
  a_threshold: 70
  b_threshold: 55

# 心跳
heartbeat:
  interval_hours: 6
  message: "轴心双子"

# 防重复
dedup:
  minutes: 30